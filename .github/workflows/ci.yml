name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall app.py intranet

      - name: Import app (production mode)
        env:
          FLASK_ENV: production
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///:memory:
        run: python -c "import app; print('app import ok')"

      - name: Health endpoint smoke test
        env:
          FLASK_ENV: production
          FLASK_SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///:memory:
        run: |
          python - <<'PY'
          import app
          c = app.app.test_client()
          r = c.get("/healthz")
          assert r.status_code in (200, 503)
          print("healthz ok:", r.status_code)
          PY
