{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Users</h3>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin') }}">Back</a>
  </div>

  <form method="post" class="row g-2 mt-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4">
      <label class="muted small">Email</label>
      <input class="form-control" name="email" required>
    </div>
    <div class="col-md-3">
      <label class="muted small">Full name</label>
      <input class="form-control" name="full_name">
    </div>
    <div class="col-md-2">
      <label class="muted small">Role</label>
      <select class="form-select" name="role">
        <option>lawyer</option>
        <option>paralegal</option>
        <option>staff</option>
        <option>admin</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="muted small">Temp password</label>
      <input class="form-control" name="password" type="password" required>
    </div>
    <div class="col-12 d-grid">
      <button class="btn btn-light">Create user</button>
    </div>
  </form>

  <div class="mt-3 table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th>Created</th></tr></thead>
      <tbody>
        {% for u in users %}
          <tr>
            <td class="fw-semibold">{{ u.email }}</td>
            <td class="muted">{{ u.full_name }}</td>
            <td><span class="badge badge-soft">{{ u.role }}</span></td>
            <td class="muted">{{ "yes" if u.is_active else "no" }}</td>
            <td class="muted">{{ u.created_at.strftime("%Y-%m-%d") }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
