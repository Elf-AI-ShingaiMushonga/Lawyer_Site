{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Announcements</h3>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('admin') }}">Back</a>
  </div>

  <form method="post" class="row g-2 mt-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-12">
      <label class="muted small">Title</label>
      <input class="form-control" name="title" required>
    </div>
    <div class="col-12">
      <label class="muted small">Body</label>
      <textarea class="form-control" name="body" rows="4" required></textarea>
    </div>
    <div class="col-12 d-grid">
      <button class="btn btn-light">Post</button>
    </div>
  </form>

  <div class="mt-3">
    {% for a in anns %}
      <div class="border-top pt-2 mt-2">
        <div class="fw-semibold">{{ a.title }}</div>
        <div class="muted small">{{ a.created_at.strftime("%Y-%m-%d %H:%M UTC") }}</div>
        <div class="mt-1">{{ (a.body|e).replace("\n","<br>")|safe }}</div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
