{% extends "base.html" %}
{% block content %}
<div class="card p-3"><h3>My Calendar</h3><table class="table"><thead><tr><th>Due</th><th>Matter</th><th>Title</th><th>Status</th><th>Ack</th></tr></thead><tbody>{% for d in deadlines %}<tr><td>{{ d.due_at }}</td><td>#{{ d.matter_id }}</td><td>{{ d.title }}</td><td>{{ d.status }}</td><td>{% if d.status != 'acknowledged' %}<form method="post" action="{{ url_for('deadline_ack', deadline_id=d.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-light">Ack</button></form>{% endif %}</td></tr>{% else %}<tr><td colspan="5" class="muted">No deadlines.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
