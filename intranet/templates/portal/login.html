{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-5 col-lg-6">
    <div class="card p-4">
      <h3 class="mb-1">Client Portal Login</h3>
      <div class="page-intro">Sign in to view shared matter updates, invoices, and secure files.</div>

      <form method="post" class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-section">
          <label class="form-label" for="portal-login-email">Email</label>
          <input class="form-control" id="portal-login-email" type="email" name="email" placeholder="client@example.com" autocomplete="username" autofocus required>
        </div>
        <div class="form-section mt-2">
          <label class="form-label" for="portal-login-password">Password</label>
          <input class="form-control" id="portal-login-password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>
        <div class="form-section mt-2">
          <label class="form-label" for="portal-login-mfa">MFA Code (If Enabled)</label>
          <input class="form-control" id="portal-login-mfa" type="text" name="mfa_code" inputmode="numeric" pattern="[0-9]*" placeholder="123456">
        </div>
        <div class="d-grid mt-2">
          <button class="btn btn-light">Sign In</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
