{% extends "base.html" %}
{% block content %}
<div class="card p-3"><h3>Monthly Trust Reports</h3><p class="muted">Select a reconciliation run to export report JSON.</p><table class="table"><thead><tr><th>Run ID</th><th>Account</th><th>Period End</th><th>Status</th><th></th></tr></thead><tbody>{% for r in runs %}<tr><td>{{ r.id }}</td><td>{{ r.trust_account_id }}</td><td>{{ r.period_end }}</td><td>{{ r.status }}</td><td><a class="btn btn-sm btn-outline-light" href="{{ url_for('trust_reports_monthly', run_id=r.id) }}">Download</a></td></tr>{% else %}<tr><td colspan="5" class="muted">No runs.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
