{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center">
    <h3 class="mb-0">Matters</h3>
    <a class="btn btn-light" href="{{ url_for('matter_create') }}">New Matter</a>
  </div>
  <form class="row g-2 mt-2" method="get">
    <div class="col-md-10">
      <input class="form-control" name="q" placeholder="Search by matter no/title/client..." value="{{ q }}">
    </div>
    <div class="col-md-2 d-grid">
      <button class="btn btn-outline-light">Search</button>
    </div>
  </form>

  <div class="mt-3 table-responsive">
    <table class="table table-sm align-middle">
      <thead><tr><th>Matter</th><th>Client</th><th>Status</th><th>Opened</th></tr></thead>
      <tbody>
        {% for m in ms %}
          <tr>
            <td><a href="{{ url_for('matter_detail', matter_id=m.id) }}">{{ m.matter_no }} — {{ m.title }}</a></td>
            <td>{{ m.client_name }}</td>
            <td><span class="badge badge-soft">{{ m.status }}</span></td>
            <td class="muted">{{ m.opened_at.strftime("%Y-%m-%d") }}</td>
          </tr>
        {% endfor %}
        {% if not ms %}
          <tr><td colspan="4" class="muted">No matters found.</td></tr>
        {% endif %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
