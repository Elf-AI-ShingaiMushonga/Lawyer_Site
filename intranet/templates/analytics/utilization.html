{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <h3 class="section-title">Utilization</h3>
  <div class="page-intro mt-1">Billable output versus available time for the selected analytics scope.</div>

  <div class="metric-grid mt-3">
    <div class="metric-card">
      <div class="metric-label">Utilization</div>
      <div class="metric-value">{{ (snapshot.utilization * 100)|round(2) }}%</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Billable Hours</div>
      <div class="metric-value">{{ snapshot.metrics.billable_hours }}</div>
    </div>
  </div>

  <div class="form-section mt-3">
    <div class="form-label">Underlying Metrics</div>
    <pre class="audit-json mt-2">{{ snapshot.metrics }}</pre>
  </div>
</div>
{% endblock %}
