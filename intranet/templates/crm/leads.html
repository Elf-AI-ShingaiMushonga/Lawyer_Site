{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3"><h3>Create Lead</h3><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-3"><input class="form-control" name="full_name" placeholder="Full name" required></div><div class="col-md-2"><input class="form-control" name="organization" placeholder="Organization"></div><div class="col-md-2"><input class="form-control" name="email" type="email" placeholder="Email"></div><div class="col-md-2"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-1"><input class="form-control" name="source" placeholder="Source"></div><div class="col-md-2"><input class="form-control" name="assigned_to" type="number" placeholder="User ID"></div><div class="col-12"><textarea class="form-control" name="notes" rows="2" placeholder="Notes"></textarea></div><div class="col-12 d-grid"><button class="btn btn-light">Add Lead</button></div></form></div>
<div class="card p-3"><h3>Lead Pipeline</h3><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Org</th><th>Email</th><th>Source</th><th>Stage</th><th></th></tr></thead><tbody>{% for l in leads %}<tr><td>{{ l.id }}</td><td>{{ l.full_name }}</td><td>{{ l.organization or '-' }}</td><td>{{ l.email or '-' }}</td><td>{{ l.source or '-' }}</td><td>{{ l.stage }}</td><td><a class="btn btn-sm btn-outline-light" href="{{ url_for('crm_lead_detail', lead_id=l.id) }}">Open</a></td></tr>{% else %}<tr><td colspan="7" class="muted">No leads.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
