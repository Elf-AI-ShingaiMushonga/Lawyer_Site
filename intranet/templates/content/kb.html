{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-5">
    <div class="card p-3">
      <h3>New Knowledge Article</h3>
      <form method="post" class="row g-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-12">
          <label class="muted small">Title</label>
          <input class="form-control" name="title" required>
        </div>
        <div class="col-12">
          <label class="muted small">Tags (comma separated)</label>
          <input class="form-control" name="tags" placeholder="POPIA, intake, precedent">
        </div>
        <div class="col-12">
          <label class="muted small">Body</label>
          <textarea class="form-control" name="body" rows="8" required></textarea>
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-light">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card p-3">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Knowledge Base</h3>
      </div>
      <form class="row g-2 mt-2" method="get">
        <div class="col-md-10">
          <input class="form-control" name="q" placeholder="Search..." value="{{ q }}">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-outline-light">Search</button>
        </div>
      </form>

      <div class="mt-3">
        {% for a in items %}
          <div class="border-top pt-2 mt-2">
            <a class="fw-semibold text-decoration-none" href="{{ url_for('kb_view', kb_id=a.id) }}">{{ a.title }}</a>
            <div class="muted small">{{ a.tags or "" }} · updated {{ a.updated_at.strftime("%Y-%m-%d") }}</div>
          </div>
        {% endfor %}
        {% if not items %}
          <div class="muted">No articles yet.</div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
