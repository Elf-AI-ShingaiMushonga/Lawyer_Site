{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <div class="d-flex justify-content-between align-items-center">
    <h3 class="mb-0">{{ a.title }}</h3>
    <a class="btn btn-sm btn-outline-light" href="{{ url_for('kb') }}">Back</a>
  </div>
  <div class="muted small mt-1">Tags: {{ a.tags or "" }} · updated {{ a.updated_at.strftime("%Y-%m-%d %H:%M UTC") }}</div>

  <div class="mt-3">
    <h5>Content</h5>
    <div class="card p-3" style="background: rgba(0,0,0,.15);">
      {{ (a.body|e).replace("\n","<br>")|safe }}
    </div>
  </div>

  <div class="mt-3">
    <h5>Edit</h5>
    <form method="post" class="row g-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-12">
        <label class="muted small">Title</label>
        <input class="form-control" name="title" value="{{ a.title }}" required>
      </div>
      <div class="col-12">
        <label class="muted small">Tags</label>
        <input class="form-control" name="tags" value="{{ a.tags or '' }}">
      </div>
      <div class="col-12">
        <label class="muted small">Body</label>
        <textarea class="form-control" name="body" rows="10" required>{{ a.body }}</textarea>
      </div>
      <div class="col-12 d-grid">
        <button class="btn btn-light">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
