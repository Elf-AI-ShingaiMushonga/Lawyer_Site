{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-5">
    <div class="card p-3">
      <h3>Add Contact</h3>
      <form method="post" class="row g-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-12">
          <label class="muted small">Name</label>
          <input class="form-control" name="name" required>
        </div>
        <div class="col-12">
          <label class="muted small">Organization</label>
          <input class="form-control" name="organization">
        </div>
        <div class="col-12">
          <label class="muted small">Email</label>
          <input class="form-control" name="email">
        </div>
        <div class="col-12">
          <label class="muted small">Phone</label>
          <input class="form-control" name="phone">
        </div>
        <div class="col-12">
          <label class="muted small">Notes</label>
          <textarea class="form-control" name="notes" rows="3"></textarea>
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-light">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card p-3">
      <div class="d-flex justify-content-between align-items-center">
        <h3 class="mb-0">Directory</h3>
      </div>
      <form class="row g-2 mt-2" method="get">
        <div class="col-md-10">
          <input class="form-control" name="q" placeholder="Search name/org/email..." value="{{ q }}">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-outline-light">Search</button>
        </div>
      </form>
      <div class="mt-3 table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Name</th><th>Org</th><th>Email</th><th>Phone</th></tr></thead>
          <tbody>
            {% for c in cs %}
              <tr>
                <td class="fw-semibold">{{ c.name }}</td>
                <td class="muted">{{ c.organization or "" }}</td>
                <td class="muted">{{ c.email or "" }}</td>
                <td class="muted">{{ c.phone or "" }}</td>
              </tr>
            {% endfor %}
            {% if not cs %}
              <tr><td colspan="4" class="muted">No contacts.</td></tr>
            {% endif %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
