{% extends "base.html" %}
{% block content %}
<div class="card p-3"><h3>Time Review</h3><table class="table"><thead><tr><th>ID</th><th>User</th><th>Matter</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{ e.id }}</td><td>{{ e.user_id }}</td><td>{{ e.matter_id }}</td><td>{{ e.rounded_hours }}</td><td>{{ e.status }}</td><td><form method="post" action="{{ url_for('time_review') }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="entry_id" value="{{ e.id }}"><input type="hidden" name="state" value="approved"><button class="btn btn-sm btn-outline-light">Approve</button></form> <form method="post" action="{{ url_for('time_review') }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="entry_id" value="{{ e.id }}"><input type="hidden" name="state" value="rejected"><button class="btn btn-sm btn-outline-light">Reject</button></form> <form method="post" action="{{ url_for('time_entry_lock', entry_id=e.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-light">Lock</button></form></td></tr>{% else %}<tr><td colspan="6" class="muted">No entries for review.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
