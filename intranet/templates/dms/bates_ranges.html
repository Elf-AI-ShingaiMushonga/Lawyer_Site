{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3"><h3>Assign Bates Range</h3><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-4"><select class="form-select" name="production_set_id" required>{% for s in sets %}<option value="{{ s.id }}">#{{ s.id }} {{ s.name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="prefix" placeholder="Prefix" required></div><div class="col-md-2"><input class="form-control" name="start_no" type="number" required></div><div class="col-md-2"><input class="form-control" name="end_no" type="number" required></div><div class="col-md-2 d-grid"><button class="btn btn-light">Assign</button></div></form></div>
<div class="card p-3"><h3>Bates Ranges</h3><table class="table"><thead><tr><th>Set</th><th>Prefix</th><th>Start</th><th>End</th><th>Created</th></tr></thead><tbody>{% for r in ranges %}<tr><td>{{ r.production_set_id }}</td><td>{{ r.prefix }}</td><td>{{ r.start_no }}</td><td>{{ r.end_no }}</td><td>{{ r.created_at }}</td></tr>{% else %}<tr><td colspan="5" class="muted">No ranges assigned.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
