{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3"><h3>Generate Invoice</h3><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-4"><select class="form-select" name="matter_id" required>{% for m in matters %}<option value="{{ m.id }}">{{ m.matter_no }} - {{ m.title }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="date" name="period_start" required></div><div class="col-md-3"><input class="form-control" type="date" name="period_end" required></div><div class="col-md-2 d-grid"><button class="btn btn-light">Generate</button></div></form><div class="mt-2"><a class="btn btn-sm btn-outline-light" href="{{ url_for('billing_ar_aging') }}">Open AR Aging</a></div></div>
<div class="card p-3"><h3>Invoices</h3><table class="table"><thead><tr><th>ID</th><th>Matter</th><th>Period</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody>{% for i in invoices %}<tr><td>{{ i.id }}</td><td>{{ i.matter_id }}</td><td>{{ i.period_start }} to {{ i.period_end }}</td><td>{{ i.status }}</td><td>{{ i.total }}</td><td><a class="btn btn-sm btn-outline-light" href="{{ url_for('billing_invoice_detail', invoice_id=i.id) }}">Open</a></td></tr>{% else %}<tr><td colspan="6" class="muted">No invoices.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
