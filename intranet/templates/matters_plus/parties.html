{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3">
  <h3>Matter Parties - {{ m.matter_no }}</h3>
  <form method="post" class="row g-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4"><input class="form-control" name="entity_name" placeholder="Entity Name" required></div>
    <div class="col-md-3"><input class="form-control" name="entity_type" value="organization"></div>
    <div class="col-md-3"><input class="form-control" name="party_role" placeholder="Role (Client/Opposing/Witness)" required></div>
    <div class="col-md-2"><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="is_primary" value="1" id="is_primary"><label class="form-check-label" for="is_primary">Primary</label></div></div>
    <div class="col-md-4"><input class="form-control" name="email" placeholder="Email"></div>
    <div class="col-md-4"><input class="form-control" name="phone" placeholder="Phone"></div>
    <div class="col-md-4 d-grid"><button class="btn btn-light">Add Party</button></div>
  </form>
</div>
<div class="card p-3"><h4>Linked Parties</h4><table class="table"><thead><tr><th>Entity</th><th>Type</th><th>Role</th><th>Primary</th></tr></thead><tbody>{% for mp, e in parties %}<tr><td>{{ e.name }}</td><td>{{ e.entity_type }}</td><td>{{ mp.party_role }}</td><td>{{ mp.is_primary }}</td></tr>{% else %}<tr><td colspan="4" class="muted">No parties linked.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
