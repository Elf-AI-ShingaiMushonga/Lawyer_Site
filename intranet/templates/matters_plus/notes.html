{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3">
  <h3>Matter Notes - {{ m.matter_no }}</h3>
  <form method="post" class="row g-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-12"><textarea class="form-control" name="body" rows="4" placeholder="Note body" required></textarea></div>
    <div class="col-md-4"><input class="form-control" name="tags" placeholder="tags"></div>
    <div class="col-md-4"><input class="form-control" name="privilege_label" placeholder="Privilege label"></div>
    <div class="col-md-4"><input class="form-control" name="acl_emails" placeholder="ACL emails (comma separated)"></div>
    <div class="col-12 d-grid"><button class="btn btn-light">Add Note</button></div>
  </form>
</div>
<div class="card p-3"><h4>Notes</h4>{% for n in notes %}<div class="activity-item"><div class="fw-semibold">{{ n.created_at }} • {{ n.tags or 'untagged' }}</div><div>{{ n.body }}</div><div class="muted small">Privilege: {{ n.privilege_label or '-' }}</div></div>{% else %}<div class="muted">No notes.</div>{% endfor %}</div>
{% endblock %}
