{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <h3>Matter Intake</h3>
  <form
    method="post"
    class="row g-2"
    data-matter-intake-form
    data-template-payload="{{ template_payload|tojson|forceescape }}"
    data-ai-parse-url="{{ url_for('matters_intake_ai_parse') }}"
    data-form-draft-key="matter-intake-wizard"
    data-form-draft-status="matter-intake-draft-status"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-12">
      <label class="muted small" for="intake-ai-prompt">AI Intake Assistant</label>
      <textarea
        class="form-control"
        id="intake-ai-prompt"
        rows="3"
        placeholder="Describe the matter intake in plain language. Include client, dispute context, dates, amounts, and counterparties."
      ></textarea>
      <div class="d-flex align-items-center gap-2 mt-2">
        <button class="btn btn-outline-light btn-sm" id="intake-ai-generate" type="button">Parse Intake with AI</button>
        <span class="form-help" id="intake-ai-status"></span>
      </div>
      <div class="form-help mt-1">Tip: press Ctrl/Cmd + Enter while focused in the prompt to run parsing.</div>
    </div>
    <div class="col-md-4"><input class="form-control" name="matter_no" placeholder="Matter Number" required></div>
    <div class="col-md-8"><input class="form-control" name="title" placeholder="Matter Title" required></div>
    <div class="col-md-6"><input class="form-control" name="client_name" placeholder="Client Name" required></div>
    <div class="col-md-3"><input class="form-control" name="jurisdiction" value="ZA"></div>
    <div class="col-md-3"><input class="form-control" name="stage" value="Intake"></div>
    <div class="col-md-4">
      <select class="form-select" name="practice_area">
        <option value="">Practice Area (Optional)</option>
        {% for area in practice_areas %}
          <option value="{{ area }}">{{ area }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4"><input class="form-control" name="case_type" placeholder="Case Type"></div>
    <div class="col-md-4">
      <select class="form-select" name="legal_category" required>
        <option value="">Select legal category...</option>
        {% for category in legal_categories %}
          <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <select class="form-select" name="template_id" required>
        <option value="">Select archetype</option>
        <option value="custom">Custom (No Archetype)</option>
        {% for t in templates %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-12"><textarea class="form-control" name="description" rows="3" placeholder="Description"></textarea></div>
    <div class="col-12"><textarea class="form-control" name="objective" rows="2" placeholder="Objective"></textarea></div>
    <div class="col-md-6">
      <select class="form-select" name="risk_level">
        {% for risk in risk_levels %}
          <option value="{{ risk }}" {% if risk == "Medium" %}selected{% endif %}>{{ risk }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <select class="form-select" name="budget_status">
        {% for budget in budget_statuses %}
          <option value="{{ budget }}" {% if budget == "On Track" %}selected{% endif %}>{{ budget }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="muted small">Archetype Required Fields</label>
      <div id="intake-archetype-required-fields" class="row g-2"></div>
      <div id="intake-archetype-help" class="form-help mt-2">Select an archetype to load required fields.</div>
    </div>
    <div class="col-12">
      <label class="muted small">Contract Autofill Fields</label>
      <div id="intake-contract-required-fields" class="row g-2"></div>
      <div id="intake-contract-help" class="form-help mt-2">Select an archetype to load contract fields for auto-generated drafts.</div>
    </div>
    <div class="col-12 d-grid"><button class="btn btn-light" data-submitting-text="Creating Intake...">Create Intake</button></div>
    <div class="col-12"><div id="matter-intake-draft-status" class="form-help mt-1"></div></div>
  </form>
</div>
{% endblock %}
