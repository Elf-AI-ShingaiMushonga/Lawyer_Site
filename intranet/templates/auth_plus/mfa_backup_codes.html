{% extends "base.html" %}
{% block content %}
<div class="card p-3">
  <h3>MFA Backup Codes</h3>
  <p class="muted">Active codes: {{ active_code_count }}</p>
  {% if backup_codes %}
    <div class="alert alert-warning">Save these codes now. They are shown once.</div>
    <ul>
      {% for code in backup_codes %}
      <li><code>{{ code }}</code></li>
      {% endfor %}
    </ul>
  {% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-outline-light">Regenerate Codes</button>
  </form>
</div>
{% endblock %}
