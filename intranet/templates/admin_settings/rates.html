{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3">
  <h3 class="mb-1">Create Rate</h3>
  <form method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-section">
      <div class="row g-2">
        <div class="col-md-3">
          <label class="form-label" for="rate-name">Rate Name</label>
          <input class="form-control" id="rate-name" name="name" placeholder="Rate name">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="rate-client">Client</label>
          <input class="form-control" id="rate-client" name="client_name" placeholder="Client">
        </div>
        <div class="col-md-2">
          <label class="form-label" for="rate-currency">Currency</label>
          <input class="form-control" id="rate-currency" name="currency" value="ZAR">
        </div>
        <div class="col-md-2">
          <label class="form-label" for="rate-per-hour">Rate Per Hour</label>
          <input class="form-control" id="rate-per-hour" name="rate_per_hour" type="number" step="0.01" placeholder="Rate" required>
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-light">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="card p-3">
  <h3 class="mb-1">Rate Cards</h3>
  <div class="table-responsive mt-2">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Client</th>
          <th>Rate</th>
          <th>Currency</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rates %}
          <tr>
            <td>{{ r.name or '-' }}</td>
            <td>{{ r.client_name or '-' }}</td>
            <td>{{ r.rate_per_hour }}</td>
            <td>{{ r.currency }}</td>
            <td>{{ "Yes" if r.is_active else "No" }}</td>
          </tr>
        {% else %}
          <tr><td colspan="5" class="muted">No rates.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
