{% extends "base.html" %}
{% block content %}
<div class="card p-3 mb-3">
  <h3 class="mb-1">Add Office</h3>
  <form method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-section">
      <div class="row g-2">
        <div class="col-md-5">
          <label class="form-label" for="office-name">Office Name</label>
          <input class="form-control" id="office-name" name="name" placeholder="Office name" required>
        </div>
        <div class="col-md-5">
          <label class="form-label" for="office-jurisdiction">Jurisdiction</label>
          <input class="form-control" id="office-jurisdiction" name="jurisdiction" placeholder="Jurisdiction">
        </div>
        <div class="col-md-2 d-grid">
          <button class="btn btn-light">Add</button>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="card p-3">
  <h3 class="mb-1">Offices</h3>
  <div class="table-responsive mt-2">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Jurisdiction</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody>
        {% for o in offices %}
          <tr>
            <td>{{ o.name }}</td>
            <td>{{ o.jurisdiction or '-' }}</td>
            <td>{{ "Yes" if o.is_active else "No" }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="muted">No offices.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
