#cloud-config
package_update: true
packages:
  - python3
  - python3-venv
  - python3-pip
  - git
  - nginx
  - ssl-cert
  - redis-server
  - postgresql-client

write_files:
  - path: /opt/law-intranet/bootstrap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_USER="ubuntu"
      APP_REPO_DIR="Lawyer_Site"
      APP_HOME="/home/${APP_USER}"
      APP_DIR="${APP_HOME}/${APP_REPO_DIR}"

      # Replace these placeholders before using this cloud-init file.
      REPO_URL="https://github.com/your-org/your-repo.git"
      REPO_REF="main"
      APP_DOMAIN="elf-ai-demo.co.za www.elf-ai-demo.co.za"
      FLASK_SECRET_KEY="REPLACE_WITH_A_LONG_RANDOM_SECRET"
      DATABASE_URL="postgresql+psycopg://app_user:app_password@db-host:5432/law_intranet?sslmode=require"
      BACKUP_ENCRYPTION_KEY="REPLACE_WITH_32_BYTE_URLSAFE_BASE64_KEY"
      TRUSTED_PROXY_HOPS="1"
      ADMIN_EMAIL="admin@firm.local"
      ADMIN_PASSWORD="REPLACE_WITH_STRONG_ADMIN_PASSWORD"
      ADMIN_NAME="Admin User"
      GUNICORN_WORKERS="3"
      GUNICORN_THREADS="2"
      GUNICORN_TIMEOUT="60"
      RATE_LIMIT_STORAGE_URI="redis://127.0.0.1:6379/0"
      RATE_LIMIT_STRATEGY="fixed-window"
      AUTH_LOGIN_RATE_LIMIT="10/minute"
      AUTH_REGISTER_RATE_LIMIT="5/hour"
      ENABLE_SCHEMA_COMPAT_SYNC="false"
      WORKER_LOOP_SLEEP_SECONDS="3"
      SCHEDULER_LOOP_SLEEP_SECONDS="30"

      if [[ "${REPO_URL}" == "https://github.com/your-org/your-repo.git" ]]; then
        echo "REPO_URL placeholder not set" >&2
        exit 1
      fi

      if [[ "${FLASK_SECRET_KEY}" == "REPLACE_WITH_A_LONG_RANDOM_SECRET" ]]; then
        echo "FLASK_SECRET_KEY placeholder not set" >&2
        exit 1
      fi

      if [[ "${DATABASE_URL}" == "postgresql+psycopg://app_user:app_password@db-host:5432/law_intranet?sslmode=require" ]]; then
        echo "DATABASE_URL placeholder not set" >&2
        exit 1
      fi

      if [[ "${BACKUP_ENCRYPTION_KEY}" == "REPLACE_WITH_32_BYTE_URLSAFE_BASE64_KEY" ]]; then
        echo "BACKUP_ENCRYPTION_KEY placeholder not set" >&2
        exit 1
      fi

      if [[ "${ADMIN_PASSWORD}" == "REPLACE_WITH_STRONG_ADMIN_PASSWORD" ]]; then
        echo "ADMIN_PASSWORD placeholder not set" >&2
        exit 1
      fi

      if [[ ! -d "${APP_DIR}/.git" ]]; then
        sudo -u "${APP_USER}" git clone "${REPO_URL}" "${APP_DIR}"
      fi

      cd "${APP_DIR}"
      sudo -u "${APP_USER}" git fetch --all --prune
      sudo -u "${APP_USER}" git checkout "${REPO_REF}"
      sudo -u "${APP_USER}" git pull --ff-only origin "${REPO_REF}"

      sudo -u "${APP_USER}" python3 -m venv "${APP_DIR}/venv"
      sudo -u "${APP_USER}" "${APP_DIR}/venv/bin/pip" install --upgrade pip
      sudo -u "${APP_USER}" "${APP_DIR}/venv/bin/pip" install -r "${APP_DIR}/requirements.txt"

      cat > "${APP_DIR}/.env" <<ENVVARS
      FLASK_ENV=production
      FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      HOST=127.0.0.1
      PORT=8000
      LOG_LEVEL=INFO
      DATABASE_URL=${DATABASE_URL}
      BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      DB_POOL_RECYCLE_SECONDS=1800
      SESSION_TTL_MINUTES=480
      MAX_UPLOAD_BYTES=52428800
      UPLOAD_DIR=uploads
      TRUST_PROXY=true
      TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS}
      FORCE_SECURE_COOKIE=true
      RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI}
      RATE_LIMIT_STRATEGY=${RATE_LIMIT_STRATEGY}
      AUTH_LOGIN_RATE_LIMIT=${AUTH_LOGIN_RATE_LIMIT}
      AUTH_REGISTER_RATE_LIMIT=${AUTH_REGISTER_RATE_LIMIT}
      GUNICORN_WORKERS=${GUNICORN_WORKERS}
      GUNICORN_THREADS=${GUNICORN_THREADS}
      GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT}
      ENABLE_SCHEMA_COMPAT_SYNC=${ENABLE_SCHEMA_COMPAT_SYNC}
      WORKER_LOOP_SLEEP_SECONDS=${WORKER_LOOP_SLEEP_SECONDS}
      SCHEDULER_LOOP_SLEEP_SECONDS=${SCHEDULER_LOOP_SLEEP_SECONDS}
      ENVVARS

      chown "${APP_USER}:${APP_USER}" "${APP_DIR}/.env"
      chmod 600 "${APP_DIR}/.env"

      mkdir -p "${APP_DIR}/uploads"
      chown -R "${APP_USER}:${APP_USER}" "${APP_DIR}/uploads"

      if [[ -d "${APP_DIR}/migrations" ]]; then
        sudo -u "${APP_USER}" \
          DATABASE_URL="${DATABASE_URL}" \
          FLASK_SECRET_KEY="${FLASK_SECRET_KEY}" \
          BACKUP_ENCRYPTION_KEY="${BACKUP_ENCRYPTION_KEY}" \
          FLASK_ENV=production \
          "${APP_DIR}/venv/bin/flask" --app "${APP_DIR}/app.py" db upgrade -d "${APP_DIR}/migrations"
      else
        sudo -u "${APP_USER}" \
          DATABASE_URL="${DATABASE_URL}" \
          FLASK_SECRET_KEY="${FLASK_SECRET_KEY}" \
          BACKUP_ENCRYPTION_KEY="${BACKUP_ENCRYPTION_KEY}" \
          FLASK_ENV=production \
          "${APP_DIR}/venv/bin/python" "${APP_DIR}/app.py" init-db
      fi

      # Create admin user on first bootstrap. If it already exists, continue.
      set +e
      sudo -u "${APP_USER}" \
        DATABASE_URL="${DATABASE_URL}" \
        FLASK_SECRET_KEY="${FLASK_SECRET_KEY}" \
        BACKUP_ENCRYPTION_KEY="${BACKUP_ENCRYPTION_KEY}" \
        FLASK_ENV=production \
        "${APP_DIR}/venv/bin/python" "${APP_DIR}/app.py" create-user \
          --email "${ADMIN_EMAIL}" \
          --password "${ADMIN_PASSWORD}" \
          --role admin \
          --name "${ADMIN_NAME}"
      CREATE_USER_RC=$?
      set -e
      if [[ ${CREATE_USER_RC} -ne 0 ]]; then
        echo "Admin creation returned non-zero (likely already exists). Continuing."
      fi

      cp "${APP_DIR}/deploy/ubuntu/systemd/law-intranet.service" /tmp/law-intranet.service
      sed -i "s#^User=ubuntu#User=${APP_USER}#" /tmp/law-intranet.service
      sed -i "s#^Group=ubuntu#Group=${APP_USER}#" /tmp/law-intranet.service
      sed -i "s#/home/ubuntu/Lawyer_Site#${APP_DIR}#g" /tmp/law-intranet.service
      cp /tmp/law-intranet.service /etc/systemd/system/law-intranet.service

      cp "${APP_DIR}/deploy/ubuntu/systemd/law-intranet-worker.service" /tmp/law-intranet-worker.service
      sed -i "s#^User=ubuntu#User=${APP_USER}#" /tmp/law-intranet-worker.service
      sed -i "s#^Group=ubuntu#Group=${APP_USER}#" /tmp/law-intranet-worker.service
      sed -i "s#/home/ubuntu/Lawyer_Site#${APP_DIR}#g" /tmp/law-intranet-worker.service
      cp /tmp/law-intranet-worker.service /etc/systemd/system/law-intranet-worker.service

      cp "${APP_DIR}/deploy/ubuntu/systemd/law-intranet-scheduler.service" /tmp/law-intranet-scheduler.service
      sed -i "s#^User=ubuntu#User=${APP_USER}#" /tmp/law-intranet-scheduler.service
      sed -i "s#^Group=ubuntu#Group=${APP_USER}#" /tmp/law-intranet-scheduler.service
      sed -i "s#/home/ubuntu/Lawyer_Site#${APP_DIR}#g" /tmp/law-intranet-scheduler.service
      cp /tmp/law-intranet-scheduler.service /etc/systemd/system/law-intranet-scheduler.service

      if [[ -d /etc/nginx/sites-available ]]; then
        cp "${APP_DIR}/deploy/ubuntu/nginx/law-intranet.conf" /etc/nginx/sites-available/law-intranet.conf
        sed -i "s/server_name elf-ai-demo\\.co\\.za www\\.elf-ai-demo\\.co\\.za;/server_name ${APP_DOMAIN};/" /etc/nginx/sites-available/law-intranet.conf
        ln -sf /etc/nginx/sites-available/law-intranet.conf /etc/nginx/sites-enabled/law-intranet.conf
        rm -f /etc/nginx/sites-enabled/default
      else
        mkdir -p /etc/nginx/conf.d
        cp "${APP_DIR}/deploy/ubuntu/nginx/law-intranet.conf" /etc/nginx/conf.d/law-intranet.conf
        sed -i "s/server_name elf-ai-demo\\.co\\.za www\\.elf-ai-demo\\.co\\.za;/server_name ${APP_DOMAIN};/" /etc/nginx/conf.d/law-intranet.conf
        rm -f /etc/nginx/conf.d/default.conf
      fi

      systemctl daemon-reload
      systemctl enable --now law-intranet
      systemctl enable --now redis-server
      systemctl enable --now law-intranet-worker
      systemctl enable --now law-intranet-scheduler

      if [[ -x /usr/sbin/make-ssl-cert ]]; then
        make-ssl-cert generate-default-snakeoil --force-overwrite
      fi

      nginx -t
      systemctl enable --now nginx
      systemctl reload nginx

runcmd:
  - [bash, -lc, "/opt/law-intranet/bootstrap.sh > /var/log/law-intranet-bootstrap.log 2>&1"]
